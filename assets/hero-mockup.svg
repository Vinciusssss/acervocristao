<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="mockupTitle">
  <title id="mockupTitle">Mockup do Acervo 100 Livros Cristãos em um tablet, com livros digitais ao fundo</title>
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123064"/>
      <stop offset="100%" stop-color="#0a1f44"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#e0a92f"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6fb"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03102a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="280" cy="280" r="260" fill="url(#bgGlow)"/>

  <!-- book stack behind tablet -->
  <g transform="translate(60,330)">
    <rect x="0" y="40" width="150" height="26" rx="4" fill="#f5c451" opacity="0.9" transform="rotate(-8 75 53)"/>
    <rect x="10" y="14" width="150" height="26" rx="4" fill="#ffffff" opacity="0.95" transform="rotate(-4 85 27)"/>
    <rect x="20" y="-10" width="150" height="26" rx="4" fill="#8fa3c9" opacity="0.9" transform="rotate(2 95 3)"/>
  </g>
  <g transform="translate(330,340)">
    <rect x="0" y="30" width="140" height="24" rx="4" fill="#ffffff" opacity="0.9" transform="rotate(6 70 42)"/>
    <rect x="-6" y="4" width="140" height="24" rx="4" fill="#f5c451" opacity="0.85" transform="rotate(3 64 16)"/>
    <rect x="0" y="-20" width="140" height="24" rx="4" fill="#8fa3c9" opacity="0.85" transform="rotate(-4 70 -8)"/>
  </g>

  <!-- tablet -->
  <g filter="url(#softShadow)">
    <rect x="130" y="90" width="300" height="380" rx="28" fill="#0a1f44" stroke="#f5c451" stroke-width="2"/>
    <rect x="150" y="118" width="260" height="322" rx="10" fill="url(#screenGrad)"/>
  </g>

  <!-- screen content -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="168" y="140" width="224" height="4" rx="2" fill="url(#goldBar)"/>
    <text x="280" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#0a1f44">ACERVO</text>
    <text x="280" y="206" text-anchor="middle" font-size="30" font-weight="700" fill="#0a1f44">100 LIVROS</text>
    <text x="280" y="234" text-anchor="middle" font-size="22" font-weight="700" fill="#e0a92f">CRISTÃOS</text>

    <!-- mini grid representing 100 book covers -->
    <g>
      <!-- row 1 -->
      <rect x="170" y="256" width="30" height="40" rx="3" fill="#0a1f44"/>
      <rect x="206" y="256" width="30" height="40" rx="3" fill="#e0a92f"/>
      <rect x="242" y="256" width="30" height="40" rx="3" fill="#325089"/>
      <rect x="278" y="256" width="30" height="40" rx="3" fill="#0a1f44"/>
      <rect x="314" y="256" width="30" height="40" rx="3" fill="#325089"/>
      <rect x="350" y="256" width="30" height="40" rx="3" fill="#e0a92f"/>
      <!-- row 2 -->
      <rect x="170" y="302" width="30" height="40" rx="3" fill="#e0a92f"/>
      <rect x="206" y="302" width="30" height="40" rx="3" fill="#325089"/>
      <rect x="242" y="302" width="30" height="40" rx="3" fill="#0a1f44"/>
      <rect x="278" y="302" width="30" height="40" rx="3" fill="#e0a92f"/>
      <rect x="314" y="302" width="30" height="40" rx="3" fill="#0a1f44"/>
      <rect x="350" y="302" width="30" height="40" rx="3" fill="#325089"/>
    </g>

    <rect x="188" y="368" width="184" height="34" rx="17" fill="#0a1f44"/>
    <text x="280" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" font-family="Poppins, Arial, sans-serif">ACESSO IMEDIATO</text>

    <text x="280" y="424" text-anchor="middle" font-size="12" fill="#5a6b8c" font-family="Poppins, Arial, sans-serif">100 e-books em PDF · entrega digital</text>
  </g>

  <!-- floating badge -->
  <g transform="translate(378,72)">
    <circle cx="30" cy="30" r="30" fill="url(#goldBar)"/>
    <text x="30" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#0a1f44" font-family="Poppins, Arial, sans-serif">100</text>
    <text x="30" y="40" text-anchor="middle" font-size="8" font-weight="700" fill="#0a1f44" font-family="Poppins, Arial, sans-serif">LIVROS</text>
  </g>
</svg>
